    <meta charset="UTF-8" />

    <meta name="theme-color" content="#04101B" />
    <link rel="manifest" href="/manifest.json" />
    <title>TrustForge | AI Cybersecurity & Recruitment Scam Detection</title>

      "applicationCategory": "SecurityApplication",

      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      }

    </script>

    <!-- Favicon / Tab Logo -->

    <!-- Google Fonts: Inter, Outfit & JetBrains Mono -->
